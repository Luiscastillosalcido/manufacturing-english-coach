<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#073b70" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="English Pro" />
  <meta name="description" content="Professional American English for automotive manufacturing engineers." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>English Pro | Manufacturing Coach</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-view="home" aria-label="English Pro home"><span class="brand-mark">⚙</span><span><strong>English Pro</strong><small>Real English for Real Work</small></span></button>
      <nav id="desktopNav"></nav>
      <div class="sidebar-quote">Build your confidence.<br/>Advance your career.</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">MANUFACTURING ENGLISH COACH</p><h1 id="viewTitle">Welcome back, Luis!</h1></div>
        <div class="top-actions"><button id="installBtn" class="ghost hidden">Install app</button><button class="avatar" data-view="profile" aria-label="Profile">LS</button></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav id="mobileNav" class="mobile-nav"></nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js" defer></script>
</body>
</html>
